services:
  integrasaude:
    image: postgres:16
    container_name: integrasaude_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: minhasenhalocal
      POSTGRES_DB: integrasaude
    ports:
      - "5433:5432"
    volumes:
      - integrasaude_data:/var/lib/postgresql/data

volumes:
  integrasaude_data: